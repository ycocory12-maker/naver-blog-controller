<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><rect width="100%" height="100%" rx="32" fill="#f4faf3"/><text x="55" y="100" font-size="48" font-weight="700" fill="#123">03 비용처리와</text><text x="55" y="160" font-size="48" font-weight="700" fill="#087b4b">부가세 공제는 다릅니다</text><rect x="55" y="220" width="370" height="250" rx="24" fill="white"/><text x="85" y="275" font-size="30" font-weight="700" fill="#1474b8">필요경비</text><text x="85" y="330" font-size="24" fill="#234">사업 관련성이 핵심</text><text x="85" y="375" font-size="24" fill="#234">소득세 계산 시 검토</text><rect x="475" y="220" width="370" height="250" rx="24" fill="#fff7f2"/><text x="505" y="275" font-size="30" font-weight="700" fill="#d65d36">부가세 매입세액공제</text><text x="505" y="330" font-size="24" fill="#234">별도의 공제요건 확인</text><text x="505" y="375" font-size="24" fill="#234">불공제 항목 여부 확인</text><text x="55" y="535" font-size="25" fill="#123">비용으로 인정된다고 해서 부가세까지 자동으로 공제되는 것은 아닙니다.</text></svg>