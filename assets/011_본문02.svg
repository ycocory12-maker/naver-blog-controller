<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><rect width="100%" height="100%" rx="32" fill="#f4f9ff"/><text x="55" y="100" font-size="48" font-weight="700" fill="#123">02 어떤 증빙을</text><text x="55" y="160" font-size="48" font-weight="700" fill="#1474b8">챙겨야 할까요?</text><g font-size="28" fill="#123"><rect x="55" y="220" width="370" height="95" rx="20" fill="white"/><text x="85" y="280">① 카드매출전표</text><rect x="475" y="220" width="370" height="95" rx="20" fill="white"/><text x="505" y="280">② 세금계산서</text><rect x="55" y="345" width="370" height="95" rx="20" fill="white"/><text x="85" y="405">③ 현금영수증</text><rect x="475" y="345" width="370" height="95" rx="20" fill="white"/><text x="505" y="405">④ 사용목적 메모</text></g><text x="55" y="525" font-size="25" fill="#123">거래 증빙과 함께 언제·누구와·무슨 목적으로 썼는지 기록해두면 좋습니다.</text></svg>