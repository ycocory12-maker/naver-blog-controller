<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><rect width="100%" height="100%" rx="32" fill="#eef9f1"/><text x="60" y="120" font-size="54" font-weight="700" fill="#123">개인카드 사업비,</text><text x="60" y="190" font-size="54" font-weight="700" fill="#087b4b">비용처리 가능할까?</text><rect x="60" y="260" width="780" height="190" rx="28" fill="white"/><text x="100" y="330" font-size="30" fill="#123">결제수단보다 중요한 것은</text><text x="100" y="385" font-size="36" font-weight="700" fill="#087b4b">사업 관련성 + 증빙</text><text x="60" y="535" font-size="24" fill="#456">개인카드라도 실제 사업을 위한 지출이라면 필요경비를 검토할 수 있습니다.</text></svg>