<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><rect width="100%" height="100%" rx="32" fill="#f1faf4"/><text x="55" y="95" font-size="48" font-weight="700" fill="#123">01 개인카드라도</text><text x="55" y="155" font-size="48" font-weight="700" fill="#087b4b">사업 관련성이 핵심입니다</text><rect x="55" y="210" width="370" height="280" rx="24" fill="#fff"/><text x="85" y="260" font-size="28" font-weight="700" fill="#087b4b">✓ 사업 관련 지출</text><text x="85" y="315" font-size="24" fill="#234">사무용품 · 업무용 프로그램</text><text x="85" y="360" font-size="24" fill="#234">업무상 교통비 · 교육비</text><text x="85" y="405" font-size="24" fill="#234">업무 관련 식사·접대비 등</text><rect x="470" y="210" width="370" height="280" rx="24" fill="#fff5f2"/><text x="500" y="260" font-size="28" font-weight="700" fill="#c94b3c">✕ 개인적 지출</text><text x="500" y="315" font-size="24" fill="#234">개인 쇼핑 · 가족 생활비</text><text x="500" y="360" font-size="24" fill="#234">개인 여행 · 사적 식사 등</text><text x="55" y="550" font-size="25" fill="#123">카드 명의보다 실제 사용 목적을 확인하세요.</text></svg>